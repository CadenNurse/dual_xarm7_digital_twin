controller_manager:
  ros__parameters:
    update_rate: 150  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    L_xarm7_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    R_xarm7_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    L_xarm_gripper_traj_controller:
      type: joint_trajectory_controller/GripperActionController

    R_xarm_gripper_traj_controller:
      type: joint_trajectory_controller/GripperActionController

L_xarm7_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - L_joint1
      - L_joint2
      - L_joint3
      - L_joint4
      - L_joint5
      - L_joint6
      - L_joint7
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      L_joint1: {trajectory: 1.0, goal: 0.01}
      L_joint2: {trajectory: 1.0, goal: 0.01}
      L_joint3: {trajectory: 1.0, goal: 0.01}
      L_joint4: {trajectory: 1.0, goal: 0.01}
      L_joint5: {trajectory: 1.0, goal: 0.01}
      L_joint6: {trajectory: 1.0, goal: 0.01}
    state_publish_rate: 25.0
    action_monitor_rate: 10.0
    interface_name: position

R_xarm7_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - R_joint1
      - R_joint2
      - R_joint3
      - R_joint4
      - R_joint5
      - R_joint6
      - R_joint7
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      R_joint1: {trajectory: 1.0, goal: 0.01}
      R_joint2: {trajectory: 1.0, goal: 0.01}
      R_joint3: {trajectory: 1.0, goal: 0.01}
      R_joint4: {trajectory: 1.0, goal: 0.01}
      R_joint5: {trajectory: 1.0, goal: 0.01}
      R_joint6: {trajectory: 1.0, goal: 0.01}
    state_publish_rate: 25.0
    action_monitor_rate: 10.0
    interface_name: position

L_xarm_gripper_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - L_drive_joint
    action_ns: gripper_action
    default: true

R_xarm_gripper_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - R_drive_joint
    action_ns: gripper_action
    default: true